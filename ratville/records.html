<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratville Township — Vital Records Office</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #191b1d;
    --bg-2: #1f2224;
    --panel: #212426;
    --panel-2: #272a2c;
    --line: #3c4043;
    --line-soft: #2b2e30;
    --ink: #e6e3da;
    --ink-dim: #9a9d9f;
    --ink-faint: #656a6c;
    --accent: #7fa895;
    --accent-bright: #9dc4b0;
    --rust: #a34c34;
    --rust-bright: #c66646;
    --radius: 2px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Libre Franklin', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 28px),
                       repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 28px);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap{ max-width: 1240px; margin: 0 auto; }

  /* ---------- header ---------- */
  header{
    position: relative;
    padding-bottom: 22px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-text{ max-width: 620px; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-bright);
    margin-bottom: 10px;
  }
  h1{
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: clamp(26px, 3.6vw, 38px);
    margin: 0 0 10px;
    letter-spacing: -0.005em;
  }
  header p.sub{
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.55;
    margin: 0;
  }
  /* double rule under header, ledger-style */
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height: 4px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line-soft);
  }

  .form-stamp{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 10px 14px;
    line-height: 1.8;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .form-stamp .row{ display:flex; justify-content: space-between; gap: 18px; }
  .form-stamp .row b{ color: var(--ink); font-weight: 600; letter-spacing: 0.02em; }
  .form-stamp .status-active{ color: var(--accent-bright); }
  .form-stamp .status-amended{ color: var(--rust-bright); }

  /* ---------- panels ---------- */
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .panel-title{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; justify-content: space-between;
    gap: 10px;
  }

  /* ---------- load panel ---------- */
  #loadPanel{ margin-bottom: 18px; }
  .load-body{ padding: 16px; display:grid; grid-template-columns: 1fr 200px; gap: 16px; }
  @media (max-width: 760px){ .load-body{ grid-template-columns: 1fr; } }

  textarea#pasteArea{
    width: 100%;
    min-height: 130px;
    resize: vertical;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 12px;
    line-height: 1.5;
  }
  textarea#pasteArea::placeholder{ color: var(--ink-faint); }
  textarea#pasteArea:focus, input:focus, button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .load-actions{ display:flex; flex-direction: column; gap: 10px; }

  input[type="file"]{ display:none; }

  .btn{
    font-family: 'Libre Franklin', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    text-align: center;
  }
  .btn:hover{ border-color: var(--accent); background: #2a2d2f; }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #12211c;
  }
  .btn-primary:hover{ background: var(--accent-bright); border-color: var(--accent-bright); }
  .btn-ghost{
    background: transparent;
  }
  .btn-sm{ padding: 7px 12px; font-size: 12px; }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  #errorMsg{
    color: var(--rust-bright);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 0 16px 14px;
    display: none;
  }

  /* ---------- stats bar ---------- */
  #statsBar{
    display: none;
    align-items: center;
    gap: 22px;
    padding: 12px 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .stat{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .stat b{ color: var(--ink); font-weight: 600; }
  .stat.amended b{ color: var(--rust-bright); }
  #statsBar .spacer{ flex: 1; }

  /* ---------- main grid ---------- */
  .main-grid{
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 18px;
    display: none;
  }
  @media (max-width: 900px){ .main-grid{ grid-template-columns: 1fr; } }

  /* ---------- table ---------- */
  #tableScroll{ max-height: 620px; overflow-y: auto; }
  table{ width: 100%; border-collapse: collapse; }
  thead th{
    position: sticky; top: 0;
    background: var(--panel-2);
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    z-index: 1;
  }
  tbody td{
    padding: 8px 14px;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
    font-size: 13px;
  }
  tbody tr:hover{ background: rgba(127,168,149,0.05); }
  tbody tr.is-amended{ background: rgba(163,76,52,0.07); }
  tbody tr.is-hidden{ display: none; }

  td.col-id{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  td.col-ref{
    color: var(--ink-dim);
    font-size: 12.5px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  td.col-edit{ width: 100%; }

  input.edit-input{
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'Libre Franklin', sans-serif;
    font-size: 13px;
    padding: 7px 9px;
  }
  tr.is-amended input.edit-input{ border-color: var(--rust); }

  .stamp{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--rust-bright);
    border: 1px dashed var(--rust);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  /* ---------- output ---------- */
  #outputPre{
    margin: 0;
    padding: 14px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-dim);
    max-height: 620px;
    overflow: auto;
    white-space: pre;
  }
  .output-actions{
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  .output-actions .btn{ flex: 1; }

  #searchBox{
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'Libre Franklin', sans-serif;
    font-size: 12.5px;
    padding: 6px 10px;
    width: 180px;
  }

  #toast{
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #12211c;
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: var(--radius);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 50;
  }
  #toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width: 10px; height: 10px; }
  ::-webkit-scrollbar-track{ background: var(--bg-2); }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--accent); }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-text">
      <div class="eyebrow">Ratville Township — Office of Vital Records</div>
      <h1>Records Amendment Desk</h1>
    </div>
    <div class="form-stamp">
      <div class="row"><span>FORM</span><b>RV-2</b></div>
      <div class="row"><span>FILED</span><b id="stampDate">—</b></div>
      <div class="row"><span>STATUS</span><b id="stampStatus" class="status-active">AWAITING RECORDS</b></div>
    </div>
  </header>

  <div class="panel" id="loadPanel">
    <div class="panel-title">
      <span>Intake</span>
      <span id="fileNameLabel" style="color:var(--ink-faint); text-transform:none; letter-spacing:0;"></span>
    </div>
    <div class="load-body">
      <textarea id="pasteArea" placeholder="Paste or upload a R4TB0T users or channels export to begin the process of amending records."></textarea>
      <div class="load-actions">
        <label class="btn" for="fileInput">Upload file (.txt / .json)</label>
        <input type="file" id="fileInput" accept=".txt,.json,application/json,text/plain">
        <button class="btn btn-primary" id="loadBtn">Load records</button>
        <button class="btn btn-ghost btn-sm" id="clearBtn">Clear</button>
      </div>
    </div>
    <div id="errorMsg"></div>
  </div>

  <div class="panel" id="statsBar">
    <span class="stat">Type: <b id="statType">—</b></span>
    <span class="stat">Records: <b id="statCount">0</b></span>
    <span class="stat amended">Amended: <b id="statAmended">0</b></span>
    <span class="spacer"></span>
    <input type="text" id="searchBox" placeholder="Filter list...">
    <button class="btn btn-ghost btn-sm" id="resetBtn">Reset all edits</button>
  </div>

  <div class="main-grid" id="mainGrid">
    <div class="panel">
      <div class="panel-title"><span id="tableTitle">Records</span></div>
      <div id="tableScroll">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><span>Amended output</span></div>
      <pre id="outputPre"></pre>
      <div class="output-actions">
        <button class="btn btn-primary" id="copyBtn">Copy JSON</button>
        <button class="btn" id="downloadBtn">Download</button>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  let recordType = null;       // 'users' | 'channels'
  let editField = null;        // 'nickname' | 'name'
  let working = [];            // live data, mutated on edit
  let original = [];           // snapshot at load time, for diff + reset
  let sourceFileName = null;

  const pasteArea   = document.getElementById('pasteArea');
  const fileInput   = document.getElementById('fileInput');
  const loadBtn     = document.getElementById('loadBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const errorMsg    = document.getElementById('errorMsg');
  const fileNameLabel = document.getElementById('fileNameLabel');

  const stampDate   = document.getElementById('stampDate');
  const stampStatus = document.getElementById('stampStatus');

  const statsBar    = document.getElementById('statsBar');
  const statType    = document.getElementById('statType');
  const statCount   = document.getElementById('statCount');
  const statAmended = document.getElementById('statAmended');
  const searchBox   = document.getElementById('searchBox');
  const resetBtn    = document.getElementById('resetBtn');

  const mainGrid    = document.getElementById('mainGrid');
  const tableTitle  = document.getElementById('tableTitle');
  const tableHead   = document.getElementById('tableHead');
  const tableBody   = document.getElementById('tableBody');

  const outputPre   = document.getElementById('outputPre');
  const copyBtn     = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const toast       = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1600);
  }

  function showError(msg){
    errorMsg.textContent = msg;
    errorMsg.style.display = msg ? 'block' : 'none';
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    sourceFileName = file.name;
    fileNameLabel.textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => { pasteArea.value = e.target.result; loadRecords(); };
    reader.onerror = () => showError('Could not read that file.');
    reader.readAsText(file);
  });

  loadBtn.addEventListener('click', loadRecords);

  clearBtn.addEventListener('click', () => {
    pasteArea.value = '';
    fileInput.value = '';
    fileNameLabel.textContent = '';
    showError('');
    recordType = null; editField = null; working = []; original = [];
    statsBar.style.display = 'none';
    mainGrid.style.display = 'none';
    stampStatus.textContent = 'AWAITING RECORDS';
    stampStatus.className = 'status-active';
    stampDate.textContent = '—';
  });

  function detectType(arr){
    if(!Array.isArray(arr) || arr.length === 0){
      throw new Error('Expected a non-empty JSON array of records.');
    }
    const sample = arr[0];
    if(typeof sample !== 'object' || sample === null){
      throw new Error('Records must be JSON objects.');
    }
    if('nickname' in sample && 'username' in sample) return 'users';
    if('name' in sample && !('username' in sample)) return 'channels';
    throw new Error('Unrecognized format — expected a "users" export (id, nickname, username) or a "channels" export (id, name).');
  }

  function loadRecords(){
    showError('');
    const text = pasteArea.value.trim();
    if(!text){ showError('Paste or upload a file first.'); return; }
    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      showError('That doesn\'t look like valid JSON. Check for a stray comma or missing bracket.');
      return;
    }
    try{
      recordType = detectType(parsed);
    }catch(e){
      showError(e.message);
      return;
    }
    editField = recordType === 'users' ? 'nickname' : 'name';
    original = JSON.parse(JSON.stringify(parsed));
    working  = JSON.parse(JSON.stringify(parsed));

    const today = new Date();
    stampDate.textContent = today.toISOString().slice(0,10);

    statsBar.style.display = 'flex';
    mainGrid.style.display = 'grid';
    tableTitle.textContent = recordType === 'users' ? 'Users — edit nickname' : 'Channels — edit name';

    buildTable();
    renderAll();
  }

  function buildTable(){
    if(recordType === 'users'){
      tableHead.innerHTML = '<tr><th style="width:170px;">ID</th><th style="width:170px;">Username</th><th>Nickname</th></tr>';
    } else {
      tableHead.innerHTML = '<tr><th style="width:200px;">ID</th><th>Channel name</th></tr>';
    }

    tableBody.innerHTML = '';
    working.forEach((rec, idx) => {
      const tr = document.createElement('tr');
      tr.dataset.idx = idx;

      const tdId = document.createElement('td');
      tdId.className = 'col-id';
      tdId.textContent = rec.id !== undefined ? rec.id : '';
      tr.appendChild(tdId);

      if(recordType === 'users'){
        const tdRef = document.createElement('td');
        tdRef.className = 'col-ref';
        tdRef.textContent = rec.username || '';
        tdRef.title = rec.username || '';
        tr.appendChild(tdRef);
      }

      const tdEdit = document.createElement('td');
      tdEdit.className = 'col-edit';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'edit-input';
      input.value = rec[editField] !== undefined && rec[editField] !== null ? rec[editField] : '';
      input.addEventListener('input', () => {
        working[idx][editField] = input.value;
        refreshRowState(tr, idx);
        renderStats();
        renderOutput();
      });
      const stamp = document.createElement('span');
      stamp.className = 'stamp';
      stamp.textContent = 'amended';
      stamp.style.display = 'none';

      const wrapper = document.createElement('div');
      wrapper.style.display = 'flex';
      wrapper.style.alignItems = 'center';
      wrapper.appendChild(input);
      wrapper.appendChild(stamp);

      tdEdit.appendChild(wrapper);
      tr.appendChild(tdEdit);
      tr._stamp = stamp;

      tableBody.appendChild(tr);
    });
  }

  function refreshRowState(tr, idx){
    const changed = working[idx][editField] !== original[idx][editField];
    tr.classList.toggle('is-amended', changed);
    if(tr._stamp) tr._stamp.style.display = changed ? 'inline-flex' : 'none';
  }

  function renderAll(){
    Array.from(tableBody.children).forEach((tr, idx) => refreshRowState(tr, idx));
    renderStats();
    renderOutput();
    applyFilter();
  }

  function renderStats(){
    statType.textContent = recordType;
    statCount.textContent = working.length;
    const amended = working.filter((rec, i) => rec[editField] !== original[i][editField]).length;
    statAmended.textContent = amended;

    if(amended > 0){
      stampStatus.textContent = 'AMENDED · ' + amended + ' PENDING COPY';
      stampStatus.className = 'status-amended';
    } else {
      stampStatus.textContent = 'ON FILE · NO CHANGES';
      stampStatus.className = 'status-active';
    }
  }

  function renderOutput(){
    outputPre.textContent = JSON.stringify(working, null, 2);
  }

  resetBtn.addEventListener('click', () => {
    working = JSON.parse(JSON.stringify(original));
    buildTable();
    renderAll();
    showToast('All edits reset');
  });

  searchBox.addEventListener('input', applyFilter);

  function applyFilter(){
    const q = searchBox.value.trim().toLowerCase();
    Array.from(tableBody.children).forEach((tr, idx) => {
      if(!q){ tr.classList.remove('is-hidden'); return; }
      const rec = working[idx];
      const haystack = [
        rec.id,
        rec[editField],
        recordType === 'users' ? rec.username : null,
        original[idx][editField]
      ].filter(Boolean).join(' ').toLowerCase();
      tr.classList.toggle('is-hidden', !haystack.includes(q));
    });
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputPre.textContent).then(() => {
      showToast('Copied to clipboard');
    }).catch(() => {
      showToast('Copy failed — select and copy manually');
    });
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([outputPre.textContent], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const base = sourceFileName ? sourceFileName.replace(/\.[^/.]+$/, '') : recordType;
    a.href = url;
    a.download = base + '-amended.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Downloaded');
  });
})();
</script>
</body>
</html>
